      function buildDonut(descList, cnt, totalAll, g){
        const R=42, cx=52, cy=52;
        const circ=2*Math.PI*R;
        const pctAll=totalAll?Math.round(cnt/totalAll*100):0;
        if(!descList.length) return '';
        let paths='', offset=0;
        descList.forEach(([k,v],i)=>{
          const color=i<3?g.palette[i]:g.palette[3];
          const arcLen=circ*(v/cnt);
          const gapLen=Math.min(circ*0.008, arcLen*0.1);
          const drawLen=Math.max(0, arcLen-gapLen);
          paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${color}" stroke-width="18"
            stroke-dasharray="${drawLen} ${circ-drawLen}"
            stroke-dashoffset="${circ*0.25-offset}"
            stroke-linecap="butt"/>`;
          offset+=arcLen;
        });
        return `<svg viewBox="0 0 104 104" width="104" height="104" style="flex-shrink:0;">
          <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="18"/>
          ${paths}
          <text x="${cx}" y="${cy-7}" text-anchor="middle" dominant-baseline="central"
            font-size="18" font-weight="800" fill="${g.accent}" font-family="DM Mono,monospace">${cnt}</text>
          <text x="${cx}" y="${cy+10}" text-anchor="middle" dominant-baseline="central"
            font-size="13" font-weight="600" fill="${g.accent}" font-family="DM Mono,monospace">${pctAll}%</text>
        </svg>`;
      }

      return groups.map(g=>{
        const members=allCards.filter(c=>c.repairResult===g.key);
        const cnt=members.length;
        if(!cnt) return '';
        const descMap={};
        members.forEach(c=>{const k=(c.repairResultDesc||'（未填）').replace(/^(OK|No)\s*/,'').trim();descMap[k]=(descMap[k]||0)+1;});
        const descList=Object.entries(descMap).sort((a,b)=>b[1]-a[1]);

        const legend=descList.map(([k,v],i)=>{
          const color=i<3?g.palette[i]:g.palette[3];
          const p2=Math.round(v/cnt*100);
          return `<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--border);">
            <div style="width:9px;height:9px;border-radius:2px;background:${color};flex-shrink:0;"></div>
            <div style="flex:1;font-size:12px;color:var(--text2);min-width:0;">${escH(k)}</div>
            <div style="font-size:13px;font-weight:700;color:${color};font-family:'DM Mono',monospace;flex-shrink:0;white-space:nowrap;">${v} <span style="font-weight:400;color:var(--text3);">(${p2}%)</span></div>
          </div>`;
        }).join('');

        return `<div style="margin-bottom:18px;padding-bottom:4px;border-bottom:2px solid var(--border);">
          <div style="font-size:13px;font-weight:700;color:${g.accent};margin-bottom:10px;">${g.label}</div>
          <div style="display:flex;gap:14px;align-items:flex-start;">
            ${buildDonut(descList, cnt, attempted, g)}
            <div style="flex:1;min-width:0;">${legend}</div>
          </div>
        </div>`;
      }).join('');
    })()}
  </div>

  <!-- 第四區塊：送修家電分類 -->
  ${catList.length?`<div class="stat-card" style="margin-bottom:12px;">
    <div class="stat-card-title">送修家電分類</div>
    ${colChart(catList.slice(0,7),maxCat,()=>'#41bbff')}
  </div>`:''}

  <!-- 第五區塊：送修品項分析 -->
  ${itemList.length?`<div class="stat-card" style="margin-bottom:12px;">
    <div class="stat-card-title">送修品項分析</div>
    <div id="treemap-wrap" style="margin-top:8px;">${buildTreemap(itemList)}</div>
  </div>`:''}

  <!-- 第六區塊：訪問關鍵字雲 -->
  <div class="stat-card" style="margin-bottom:12px;">
    <div class="stat-card-title">訪問關鍵字雲</div>
    ${wordList.length?`
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;line-height:1.8;">
      ${wordList.map(([w,c])=>{
        const sz=Math.round(14+((c-1)/(maxW||1))*18);
        const op=0.55+0.45*(c/maxW);
        const colors=['#ff6d48','#0dae42','#ffab2d','#7c63ec','#41bbff','#2e2e2e'];
        const col=colors[Math.abs(w.charCodeAt(0))%colors.length];
        return`<span style="font-size:${sz}px;font-weight:${c>1?700:500};color:${col};opacity:${op.toFixed(2)};cursor:default;" title="${c}次">${escH(w)}</span>`;
      }).join('')}
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:4px;">共 ${ivTotal} 筆訪問・${Object.keys(wordMap).length} 個關鍵詞</div>
    `:`<div style="text-align:center;padding:24px 0;font-size:14px;color:var(--text3);">尚無訪問資料</div>`}
  </div>
  `;}

// ══ 照片 ══
const photoCache = {};
function getPhotoCacheKey(sid, zone){ return sid + '__' + zone; }

// 照片 metadata 持久化（存 fileId/fileUrl/dataUrl）
function savePhotoMeta(sid, zone){
  const key = getPhotoCacheKey(sid, zone);
  const photos = (photoCache[key]||[]).map(p=>({
    status:  p.status,
    fileId:  p.fileId  || '',
    fileUrl: p.fileUrl || '',
    name:    p.name    || '',
    dataUrl: p.status === 'done' ? (p.dataUrl || '') : '',
  }));
  try{ localStorage.setItem('pm_'+key, JSON.stringify(photos)); }catch(e){
    // localStorage 空間不足時，只存 metadata 不存 dataUrl
    const slim = photos.map(p=>({...p, dataUrl:''}));
    try{ localStorage.setItem('pm_'+key, JSON.stringify(slim)); }catch(e2){}
  }
}
function loadPhotoMeta(sid, zone){
  const key = getPhotoCacheKey(sid, zone);
  try{
    const saved = JSON.parse(localStorage.getItem('pm_'+key)||'[]');
    if(!photoCache[key]) photoCache[key] = [];
    saved.forEach((m,i)=>{
      if(!photoCache[key][i]){
        photoCache[key][i] = {
          dataUrl: m.dataUrl || '',
          file: null,
          status:  m.status,
          fileId:  m.fileId,
          fileUrl: m.fileUrl,
          name:    m.name
        };
      }
    });
  }catch(e){}
}
function buildPhotoSection(c, sid, zone, maxCount){
  const key = getPhotoCacheKey(sid, zone);
  if(!photoCache[key]) photoCache[key] = [];
  // 讀取持久化的照片 metadata
  loadPhotoMeta(sid, zone);
  const photos = photoCache[key];
  const thumbsHtml = photos.map((p, i) => {
    // 優先用 dataUrl，沒有才用 Drive thumbnail
    const imgSrc = p.dataUrl
      ? p.dataUrl
      : (p.fileId ? `https://drive.google.com/thumbnail?id=${p.fileId}&sz=w200` : '');
    const clickAction = p.fileUrl
      ? `window.open('${p.fileUrl}','_blank')`
      : (p.dataUrl ? `openLightbox('${p.dataUrl}')` : '');
    return `<div class="photo-thumb-wrap" id="pt-${escH(sid)}-${zone}-${i}">
      ${imgSrc ? `<img src="${imgSrc}" onclick="${clickAction}" style="cursor:pointer;">` : '<div style="width:100%;height:100%;background:var(--surface2);"></div>'}
      ${p.status!=='uploading'?`<button class="photo-del-btn" onclick="deletePhoto('${escH(sid)}','${zone}',${i})" title="刪除">×</button>`:''}
      ${photoStatusBadge(p)}
    </div>`;
  }).join('');
  const canAdd = photos.length < maxCount;
  const addBtn = canAdd ? `
    <div class="photo-add-btn" onclick="triggerPhotoInput('${escH(sid)}','${zone}',${maxCount})" title="新增照片（相簿或相機）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M20.5 7H18l-2-3H8L6 7H3.5A1.5 1.5 0 002 8.5v11A1.5 1.5 0 003.5 21h17a1.5 1.5 0 001.5-1.5v-11A1.5 1.5 0 0020.5 7z"/></svg>
      <span>照片${zone}</span>
    </div>` : '';
  return `<div class="photo-group">
    <div class="photo-group-title">照片${zone}</div>
    <div class="photo-thumbs" id="photo-thumbs-${escH(sid)}-${zone}">
      ${thumbsHtml}${addBtn}
    </div>
  </div>`;
}
// 壓縮圖片到最長邊 1200px，JPEG 品質 0.82
function compressImage(file, callback){
  const MAX = 780, Q = 0.82;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = Math.round(h * MAX / w); w = MAX; }
        else      { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', Q);
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function triggerPhotoInput(sid, zone, maxCount){
  const key = getPhotoCacheKey(sid, zone);
  if(!photoCache[key]) photoCache[key] = [];
  if(photoCache[key].length >= maxCount){ showToast('最多 '+maxCount+' 張'); return; }
  // 取得目前卡片 id（sid 是 rowNum）
  const c = allCards.find(x => x.rowNum === parseInt(sid));
  const cardId = c ? (c.id || '') : '';

  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async function(){
    if(!inp.files || !inp.files[0]) return;
    const file = inp.files[0];
    const idx = photoCache[key].length;
    // 先加入 pending 縮圖讓使用者看到預覽
    const placeholderUrl = URL.createObjectURL(file);
    const entry = { dataUrl: placeholderUrl, file, status:'pending' };
    photoCache[key].push(entry);
    refreshPhotoThumbs(sid, zone, maxCount);

    // 壓縮
    compressImage(file, async function(compressedDataUrl){
      entry.dataUrl = compressedDataUrl;
      refreshPhotoThumbs(sid, zone, maxCount);

      if(!cardId){
        showToast('📷 照片已暫存，請先填入掛號號碼再儲存');
        return;
      }
      // 立即上傳
      entry.status = 'uploading';
      refreshPhotoThumbs(sid, zone, maxCount);
      try {
        const r = await uploadPhotoToGAS(cardId, zone, idx, file, compressedDataUrl, c ? c.rowNum : null);
        // 顯示完整回傳（診斷用）
        showToast('回傳:' + JSON.stringify(r).slice(0, 120), 6000);
        if(r && !r.error){
          entry.status  = 'done';
          entry.fileId  = r.fileId  || '';
          entry.fileUrl = r.fileUrl || '';
          savePhotoMeta(sid, zone);
        } else {
          entry.status = 'fail';
        }
      } catch(e){
        entry.status = 'fail';
        showToast('CATCH:' + e.message.slice(0, 120), 6000);
      }
      refreshPhotoThumbs(sid, zone, maxCount);
    });
  };
  inp.click();
}

function photoStatusBadge(p){
  if(p.status==='done')     return `<div class="photo-status done">✓ 已上傳</div>`;
  if(p.status==='uploading')return `<div class="photo-status uploading"><span class="spin">↻</span> 上傳中</div>`;
  if(p.status==='fail')     return `<div class="photo-status fail">✗ 失敗</div>`;
  return `<div class="photo-status pending">待上傳</div>`;
}

function refreshPhotoThumbs(sid, zone, maxCount){
  const key = getPhotoCacheKey(sid, zone);
  const photos = photoCache[key] || [];
  const container = document.getElementById('photo-thumbs-'+sid+'-'+zone);
  if(!container) return;
  const thumbs = photos.map((p, i) => {
    const imgSrc = p.dataUrl
      ? p.dataUrl
      : (p.fileId ? `https://drive.google.com/thumbnail?id=${p.fileId}&sz=w200` : '');
    const clickAction = p.fileUrl
      ? `window.open('${p.fileUrl}','_blank')`
      : (p.dataUrl ? `openLightbox('${p.dataUrl}')` : '');
    return `<div class="photo-thumb-wrap">
      ${imgSrc?`<img src="${imgSrc}" onclick="${clickAction}" style="cursor:pointer;">`:'<div style="width:100%;height:100%;background:var(--surface2);"></div>'}
      ${p.status!=='uploading'?`<button class="photo-del-btn" onclick="deletePhoto('${sid}','${zone}',${i})" title="移除">×</button>`:''}
      ${photoStatusBadge(p)}
    </div>`;
  }).join('');
  const canAdd = photos.length < maxCount;
  const addBtn = canAdd ? `
    <div class="photo-add-btn" onclick="triggerPhotoInput('${sid}','${zone}',${maxCount})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M20.5 7H18l-2-3H8L6 7H3.5A1.5 1.5 0 002 8.5v11A1.5 1.5 0 003.5 21h17a1.5 1.5 0 001.5-1.5v-11A1.5 1.5 0 0020.5 7z"/></svg>
      <span>新增照片</span>
    </div>` : '';
  container.innerHTML = thumbs + addBtn;
}
function deletePhoto(sid, zone, idx){
  const key = getPhotoCacheKey(sid, zone);
  if(!photoCache[key]) return;
  photoCache[key].splice(idx, 1);
  savePhotoMeta(sid, zone);
  refreshPhotoThumbs(sid, zone, 2);
  markDirty(sid);  // 讓儲存按鍵變可按
}
function openLightbox(dataUrl){
  const lb = document.createElement('div');
  lb.className = 'photo-lightbox';
  lb.innerHTML = `<img src="${dataUrl}"><button class="photo-lightbox-close" onclick="this.parentNode.remove()">×</button>`;
  lb.onclick = function(e){ if(e.target===lb) lb.remove(); };
  document.body.appendChild(lb);
}

const PHOTO_FOLDER_ID = '1SHI--kvSIul84RBgOC8efGtU7fuFmBTl';

async function uploadPhotoToGAS(cardId, zone, idx, file, dataUrl, rowNum) {
  const ext  = (file.type || 'image/jpeg').split('/')[1] || 'jpg';
  const name = `${cardId}_${zone}_${idx+1}.${ext}`;
  const base64 = dataUrl.split(',')[1];
  if(!base64) throw new Error('base64 資料為空');
  return await gasPostPhoto({
    action:   'uploadPhoto',
    fileName: name,
    mimeType: 'image/jpeg',
    base64:   base64,
    rowNum:   rowNum,
    zone:     zone
  });
}

async function uploadAllPhotos(cardId) {
  const zones = ['外觀','配件','內部'];
  let successCount = 0, failCount = 0;
  for (const zone of zones) {
    const key    = getPhotoCacheKey(cardId, zone);
    const photos = photoCache[key] || [];
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      if (p.status === 'done') continue; // 已上傳跳過
      // 設為上傳中，刷新徽章
      p.status = 'uploading';
      refreshPhotoThumbs(cardId, zone, 2);
      try {
        const r = await uploadPhotoToGAS(cardId, zone, i, p.file, p.dataUrl);
        if (r && (r.success || r.fileId)) {
          p.status  = 'done';
          p.fileId  = r.fileId || '';
          p.fileUrl = r.fileUrl || '';
          successCount++;
        } else {
          p.status = 'fail';
          failCount++;
        }
      } catch(e) {
        p.status = 'fail';
        failCount++;
      }
      // 刷新縮圖顯示最新狀態
      refreshPhotoThumbs(cardId, zone, 2);
    }
  }
  if (failCount > 0) showToast(`⚠️ ${failCount} 張照片上傳失敗，其餘 ${successCount} 張成功`);
  else if (successCount > 0) showToast(`✓ ${successCount} 張照片已上傳至 Drive`);
}

async function fetchSheet(name){
  const res  = await fetch(GAS_URL + '?action=summary&sheet=' + encodeURIComponent(name) + '&t=' + Date.now());
  const json = await res.json();
  if(json && Array.isArray(json.values)) return { ok:true, data:json };
  return { ok:false, msg:(json && json.error) || '' };
}
async function loadIntroSummary(force){
  if(!force && introData.at && Date.now()-introData.at < 60000) return;
  await Promise.all(['summary','footprint'].map(async k=>{
    try{
      const r = await fetchSheet(INTRO_SHEETS[k]);
      if(r.ok){ introData[k] = r.data; introData.state[k] = 'ok'; introData.msg[k] = ''; }
      else    { introData[k] = null; introData.state[k] = r.msg ? 'error' : 'missing'; introData.msg[k] = r.msg; }
    }catch(e){ introData[k] = null; introData.state[k] = 'error'; introData.msg[k] = e.message; }
  }));
  introData.at = Date.now();
}

// ── 儲存格工具 ──
function colIdx(letters){ let c=0; for(const ch of String(letters).toUpperCase()) c = c*26 + (ch.charCodeAt(0)-64); return c-1; }
function a1ToRC(a1){
  const m = /^\s*([A-Za-z]+)(\d+)\s*$/.exec(a1||'');
  return m ? [parseInt(m[2],10)-1, colIdx(m[1])] : null;
}
function cellOf(sheet, r, c){
  if(!sheet) return { v:undefined, d:undefined };
  return { v:(sheet.values||[])[r]?.[c], d:(sheet.display||[])[r]?.[c] };
}
function cellText(a1){
  const rc = a1ToRC(a1); if(!rc || !introData.summary) return '';
  const { v, d } = cellOf(introData.summary, rc[0], rc[1]);
  return String((d!==undefined && d!=='') ? d : (v ?? '')).trim();
}
function sumRange(a1){
  if(!a1 || !introData.summary) return null;
  const [a,b] = a1.split(':'); const s0 = a1ToRC(a), e0 = a1ToRC(b||a);
  if(!s0 || !e0) return null;
  const rows = [];
  for(let r=s0[0]; r<=e0[0]; r++){
    const v=[], d=[];
    for(let c=s0[1]; c<=e0[1]; c++){ const x = cellOf(introData.summary, r, c); v.push(x.v); d.push(x.d); }
    rows.push({v,d});
  }
  return rows;
}
function toNum(x){ const n = parseFloat(String(x??'').replace(/[^\d.\-]/g,'')); return isNaN(n)?0:n; }
function driveThumb(url){
  const m = /(?:\/d\/|id=)([\w-]{20,})/.exec(url||'');
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000` : (url||'');
}

// ── 地址 → 地圖位置 ──
const TW_COUNTY_ALIAS = {'台北縣':'新北市','桃園縣':'桃園市','台中縣':'台中市','台南縣':'台南市','高雄縣':'高雄市'};
const TW_COUNTY_NAMES = Object.keys(TW_MAP.counties);
const TW_TOWN_KEYS    = Object.keys(TW_MAP.towns);
function twNorm(s){ return String(s||'').replace(/臺/g,'台').replace(/\s+/g,''); }
function locateAddress(addr){
  let a = twNorm(addr);
  if(!a) return null;
  for(const k in TW_COUNTY_ALIAS) a = a.split(k).join(TW_COUNTY_ALIAS[k]);
  let county = TW_COUNTY_NAMES.find(c=>a.includes(c)) || TW_COUNTY_NAMES.find(c=>a.includes(c.slice(0,2)));
  let rest0 = a;
  if(county){
    const i = a.indexOf(county);
    rest0 = i>=0 ? a.slice(i+county.length) : a;   // 只寫「花蓮市」這類簡稱時，保留整串比對鄉鎮
  }
  let best = null, bestLen = 0;
  for(const k of TW_TOWN_KEYS){
    if(county && !k.startsWith(county)) continue;
    const tn = k.slice(3), stem = tn.length>2 ? tn.slice(0,-1) : '';
    // 縣市簡稱（如「宜蘭」）不拿來比對鄉鎮，除非鄉鎮本身就叫這個名字（如 宜蘭市）
    const cs = county ? county.slice(0,2) : '';
    const rest = (cs && !tn.startsWith(cs)) ? rest0.split(cs).join('') : rest0;
    if(rest.includes(tn) && tn.length+1 > bestLen){ best=k; bestLen=tn.length+1; }
    else if(stem.length>=2 && !(cs && tn.startsWith(cs)) && rest.includes(stem) && stem.length > bestLen){ best=k; bestLen=stem.length; }
  }
  if(best) return { key:best, name:best, xy:TW_MAP.towns[best] };
  if(county) return { key:county, name:county, xy:TW_MAP.counties[county] };
  return null;
}

const SAMPLE_BREAKDOWN = {
  ok:[['OK 更換零件',40],['OK 無更換零件: 清潔/重新組裝或固定',26],['OK 非故障/不熟悉或不當操作',8],['OK 維修但原有部分功能失效',3]],

// 足跡：SUMMARY_MAP 分頁中，活動分類為「維修健檢」的每一列 = 去過一次
function getFootprint(){
  const sh = introData.footprint;
  const map = {}; const unmatched = []; let visits = 0, noAddr = 0, yMin = null, yMax = null;
  const add = (addr, n) => {
    const loc = locateAddress(addr);
    if(!loc){ unmatched.push(addr); return; }
    if(!map[loc.key]) map[loc.key] = { ...loc, count:0 };
    map[loc.key].count += n; visits += n;
  };
  let sample = false;
  if(sh){
    const cY = colIdx(FOOTPRINT.year), cC = colIdx(FOOTPRINT.category), cA = colIdx(FOOTPRINT.address);
    const rows = (sh.values||[]).length;
    for(let r=0; r<rows; r++){
      const cat  = String(cellOf(sh,r,cC).d ?? cellOf(sh,r,cC).v ?? '').trim();
      if(!cat.includes(FOOTPRINT.match)) continue;
      const addr = String(cellOf(sh,r,cA).d ?? cellOf(sh,r,cA).v ?? '').trim();
      if(!addr){ noAddr++; continue; }
      const y = parseInt(String(cellOf(sh,r,cY).d ?? cellOf(sh,r,cY).v ?? '').replace(/\D/g,'').slice(0,4), 10);
      if(y>1990 && y<2100){ yMin = yMin===null ? y : Math.min(yMin,y); yMax = yMax===null ? y : Math.max(yMax,y); }
      add(addr, 1);
    }
  } else {
    sample = true;
    SAMPLE_LOCATIONS.forEach(([a,n])=>add(a,n));
  }
  const places = Object.values(map).sort((a,b)=>b.count-a.count);
  return { places, visits, sample, unmatched, noAddr, yMin, yMax };
}

// 維修成果只讀 overall_summary（不連動維修分頁）
// L 欄出現「OK…」或「NO…」時切換分組，O 欄是細項、P 欄是件數；件數為 0 的不畫
function getRepairBreakdown(){
  const rows = sumRange(INTRO_CELLS.breakdown);
  if(!rows) return { ok:SAMPLE_BREAKDOWN.ok, no:SAMPLE_BREAKDOWN.no, source:'sample' };
  const ok = [], no = []; let group = null;
  rows.forEach(r=>{
    const g = String(r.d[0] ?? r.v[0] ?? '').trim().toUpperCase();
    if(g.startsWith('OK')) group = ok;
    else if(g.startsWith('NO')) group = no;
    else if(g.includes('SUB-TOTAL') || g.includes('合計')) group = null;
    const label = String(r.d[3] ?? r.v[3] ?? '').trim();
    const n = toNum(r.v[4]);
    if(group && label && n>0) group.push([label, n]);
  });
  ok.sort((a,b)=>b[1]-a[1]); no.sort((a,b)=>b[1]-a[1]);
  return { ok, no, source:'sheet' };
}

// ── SVG 小工具 ──
function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r0,r1,a0,a1){
  if(a1-a0 >= 359.99){  // 整圈：拆成兩半
    return arcPath(cx,cy,r0,r1,a0,a0+180) + arcPath(cx,cy,r0,r1,a0+180,a1);
  }
  const big = (a1-a0)>180 ? 1 : 0;
  const [x1,y1]=polar(cx,cy,r1,a0), [x2,y2]=polar(cx,cy,r1,a1);
  if(r0<=0) return `M${cx} ${cy}L${x1.toFixed(2)} ${y1.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z`;
  const [x3,y3]=polar(cx,cy,r0,a1), [x4,y4]=polar(cx,cy,r0,a0);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}L${x3.toFixed(2)} ${y3.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z`;
}

const OK_SHADES = ['#1e7a4c','#3d9466','#6db187','#9ccbad','#c2e0cc','#d6ebdd'];
const NO_SHADES = ['#e3a03a','#ebb55b','#f0c880','#f4d7a3','#f8e5c2'];
const shade = (arr,i) => arr[Math.min(i, arr.length-1)];
const shortLabel = s => String(s).replace(/\s*[\(（][^\)）]*[\)）]/g,'').trim();

function buildRepairDonut(ok, no){
  const okSum = ok.reduce((s,x)=>s+x[1],0), noSum = no.reduce((s,x)=>s+x[1],0), tot = okSum+noSum;
  if(!tot) return '';
  const cx=120, cy=120, R0=74, R1=82, R2=112, gap='#ffffff';
  const okDeg = okSum/tot*360;
  const C = (2*Math.PI*60).toFixed(1);
  let svg = `<svg viewBox="0 0 240 240" class="pv-donut" role="img" aria-label="成功與失敗維修分布">
    <defs><mask id="iv2-sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <circle class="iv2-sweep" cx="120" cy="120" r="60" fill="none" stroke="#fff" stroke-width="122"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 120 120)"/>
    </mask></defs><g mask="url(#iv2-sweep)">`;
  let a = 0, labels = '';
  const seg = (items, shades, grp) => items.forEach(([l,n],i)=>{
    const d = n/tot*360; if(d<=0) return;
    const [dx,dy] = polar(0,0,6,a+d/2);
    svg += `<path class="iv2-seg" data-seg="${grp}-${i}" style="--dx:${dx.toFixed(2)}px;--dy:${dy.toFixed(2)}px" d="${arcPath(cx,cy,R1,R2,a,a+d)}" fill="${shade(shades,i)}" stroke="${gap}" stroke-width="1.6"/>`;
    const pct = Math.round(n/tot*100);
    if(pct>=4){
      const [tx,ty] = polar(cx,cy,(R1+R2)/2,a+d/2);
      labels += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Inter,sans-serif" font-weight="600" font-size="9.5" fill="${i>=2?'#3a3f3b':'#ffffff'}">${pct}%</text>`;
    }
    a += d;
  });
  seg(ok, OK_SHADES, 'ok'); seg(no, NO_SHADES, 'no');
  svg += `<path class="iv2-core" data-grp="ok" d="${arcPath(cx,cy,0,R0,0,okDeg)}" fill="${OK_SHADES[0]}" stroke="${gap}" stroke-width="1.6"/>`;
  if(noSum) svg += `<path class="iv2-core" data-grp="no" d="${arcPath(cx,cy,0,R0,okDeg,360)}" fill="${NO_SHADES[1]}" stroke="${gap}" stroke-width="1.6"/>`;
  const okPct = Math.round(okSum/tot*100), noPct = 100-okPct;
  const [ox,oy] = noSum ? polar(cx,cy,R0*0.42,okDeg/2) : [cx,cy];
  labels += `<text x="${ox.toFixed(1)}" y="${(oy-8).toFixed(1)}" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">成功</text>`;
  labels += `<text x="${ox.toFixed(1)}" y="${(oy+11).toFixed(1)}" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#ffffff">${okPct}%</text>`;
  if(noSum && noPct>=6){
    const [nx,ny] = polar(cx,cy,R0*0.55,okDeg+(360-okDeg)/2);
    labels += `<text x="${nx.toFixed(1)}" y="${(ny-6).toFixed(1)}" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="10" font-weight="600" fill="#5a3b08">失敗</text>`;
    labels += `<text x="${nx.toFixed(1)}" y="${(ny+10).toFixed(1)}" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#5a3b08">${noPct}%</text>`;
  }
  return svg + labels + `</g></svg>`;
}

function buildMapSvg(places){
  const M = TW_MAP;
  let s = `<svg viewBox="0 0 ${M.W} ${M.H}" class="pv-map" role="img" aria-label="維修健檢足跡地圖">`;
  const insetName = {matsu:'馬祖', kinmen:'金門'};
  for(const k in M.insets){
    const [x,y,w,h] = M.insets[k];
    s += `<rect x="${x-5}" y="${y-5}" width="${w+10}" height="${h+21}" rx="6" fill="#ffffff"/>`;
    s += `<text x="${x-1}" y="${y+h+12}" class="pv-map-lbl">${insetName[k]}</text>`;
  }
  s += M.paths.map(p=>`<path d="${p.d}" fill="var(--i-land)" stroke="var(--i-soft)" stroke-width="${p.g==='main'?0.6:0}"/>`).join('');
  const lab = (key, txt, dx, dy) => { const xy = M.towns[key] || M.counties[key]; return xy ? `<text x="${(xy[0]+dx).toFixed(1)}" y="${(xy[1]+dy).toFixed(1)}" class="pv-map-lbl">${txt}</text>` : ''; };
  s += lab('澎湖縣','澎湖',-8,34) + lab('台東縣綠島鄉','綠島',7,3) + lab('台東縣蘭嶼鄉','蘭嶼',7,3) + lab('屏東縣琉球鄉','小琉球',-30,3);
  // 每去一次 = 一個半透明圓點，重疊越多顏色越深；由北往南依序出現
  const order = places.map((p,i)=>[i,p.xy[1]]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  const rank = {}; order.forEach((idx,r)=>rank[idx]=r);
  places.forEach((p,i)=>{
    const [x,y] = p.xy, n = Math.min(Math.round(p.count), 10);
    const delay = Math.min(rank[i]*55, 1600) + 250;
    s += `<g class="iv2-dot" style="--d:${delay}ms">`;
    for(let k=0;k<n;k++) s += `<circle cx="${x}" cy="${y}" r="5" fill="#1e7a4c" fill-opacity=".28"/>`;
    s += `<circle cx="${x}" cy="${y}" r="8" fill="transparent"><title>${escH(p.name)} · ${p.count} 次</title></circle></g>`;
  });
  return s + `</svg>`;
}
function legendDot(n){
  let c = '';
  for(let i=0;i<n;i++) c += `<circle cx="6" cy="6" r="4.4" fill="#1e7a4c" fill-opacity=".28"/>`;
  return `<svg width="12" height="12" viewBox="0 0 12 12">${c}</svg>`;
}

// ── 數字跳動 ──
function parseCount(t){
  const m = /^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/.exec(String(t||'').trim());
  if(!m) return null;
  const raw = m[2], target = parseFloat(raw.replace(/,/g,''));
  const dec = (raw.split('.')[1]||'').length, grp = raw.includes(',');
  return { target, fmt: v => m[1] + v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:grp}) + m[3] };
}
function runCount(el){
  const f = parseCount(el.dataset.count);
  if(!f){ el.textContent = el.dataset.count; return; }
  const t0 = performance.now(), dur = 1600;
  const step = now => {
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,4);
    el.textContent = f.fmt(f.target*e);
    if(k<1) requestAnimationFrame(step); else el.textContent = el.dataset.count;
  };
  requestAnimationFrame(step);
}
const cnt = t => { const x = escH(t); return parseCount(t) ? `<span data-count="${x}">${x}</span>` : x; };

// ── 捲動出現 ──
let _introObs = null;
function initIntroMotion(root){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(_introObs) _introObs.disconnect();
  const targets = root.querySelectorAll('[data-rv],[data-count],.pv-map,.pv-donut');
  if(reduce || !('IntersectionObserver' in window)){ targets.forEach(el=>el.classList.add('in')); return; }
  root.querySelectorAll('[data-count]').forEach(el=>{ const f = parseCount(el.dataset.count); if(f) el.textContent = f.fmt(0); });
  _introObs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target;
      el.classList.add('in');
      if(el.dataset.count !== undefined) runCount(el);
      _introObs.unobserve(el);
    });
  }, { threshold:0.18, rootMargin:'0px 0px -6% 0px' });
  targets.forEach(el=>_introObs.observe(el));
}

// ── 圓餅與圖例連動 ──
let INTRO_SEG_INFO = {};
function introHighlight(key){
  const root = document.getElementById('intro-root');
  const donut = root.querySelector('.pv-donut'), lg = root.querySelector('.iv2-lg'), ro = root.querySelector('.iv2-readout');
  if(!donut || !lg) return;
  const isGrp = key && key.startsWith('grp:');
  const g = isGrp ? key.slice(4) : '';
  root.querySelectorAll('[data-seg]').forEach(el=>{
    const k = el.dataset.seg;
    el.classList.toggle('on', !!key && (isGrp ? k.startsWith(g+'-') : k===key));
  });
  root.querySelectorAll('.iv2-core').forEach(el=>el.classList.toggle('on', !!key && (isGrp ? el.dataset.grp===g : (key||'').startsWith(el.dataset.grp+'-'))));
  donut.classList.toggle('hl', !!key);
  lg.classList.toggle('hl', !!key);
  const info = key && INTRO_SEG_INFO[key];
  if(ro) ro.innerHTML = info ? `<b>${escH(info.label)}</b><span class="iv2-num">${info.n.toLocaleString('en-US')}</span> 件・<span class="iv2-num">${info.pct}</span>`
                             : '將滑鼠移到圓餅上（手機請點選），查看各項細節';
  if(info && !isGrp){
    const item = lg.querySelector(`.iv2-lg-i[data-seg="${key}"]`);
    if(item && window.matchMedia('(hover:none)').matches) item.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}
function bindDonut(root){
  const donut = root.querySelector('.pv-donut'), lg = root.querySelector('.iv2-lg');
  if(!donut || !lg) return;
  const keyOf = el => {
    const s = el.closest('[data-seg]'); if(s) return s.dataset.seg;
    const c = el.closest('.iv2-core'); if(c) return 'grp:'+c.dataset.grp;
    return null;
  };
  let pinned = null;
  [donut, lg].forEach(box=>{
    box.addEventListener('pointerover', e=>{ if(e.pointerType==='touch') return; const k = keyOf(e.target); if(k) introHighlight(k); });
    box.addEventListener('pointerleave', e=>{ if(e.pointerType==='touch') return; introHighlight(pinned); });
    box.addEventListener('click', e=>{ const k = keyOf(e.target); pinned = (k && k!==pinned) ? k : null; introHighlight(pinned); });
  });
}

function tripClick(i){ getTrip(i).img ? openTripView(i) : pickTripPhoto(i); }
function pickTripPhoto(i){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function(){
    if(!inp.files || !inp.files[0]) return;
    compressImage(inp.files[0], function(dataUrl){
      const old = getTrip(i);
      const cap = prompt('照片說明（例如：2019 澎湖馬公，可留空）：', old.cap || '');
      try{ localStorage.setItem('introTrip'+i, JSON.stringify({ img:dataUrl, cap: cap===null ? (old.cap||'') : cap.trim() })); }
      catch(e){ showToast('⚠️ 照片太大，無法儲存'); return; }
      refreshTrip(i);
    });
  };
  inp.click();
}
function openTripView(i){
  const t = getTrip(i);
  const ov = document.createElement('div');
  ov.className = 'iv2-tv';
  ov.innerHTML = `<img src="${t.img}" alt="">
    ${t.cap ? `<div class="iv2-tv-cap">${escH(t.cap)}</div>` : ''}
    <div class="iv2-tv-btns">
      <button data-a="change">更換照片</button><button data-a="cap">修改說明</button><button data-a="del">移除</button><button class="pri" data-a="close">關閉</button>
    </div>`;
  ov.onclick = e => {
    const a = e.target.dataset && e.target.dataset.a;
    if(e.target===ov || a==='close'){ ov.remove(); return; }
    if(a==='change'){ ov.remove(); pickTripPhoto(i); }
    if(a==='cap'){
      const cap = prompt('照片說明：', t.cap||'');
      if(cap!==null){ try{ localStorage.setItem('introTrip'+i, JSON.stringify({ img:t.img, cap:cap.trim() })); }catch(err){} refreshTrip(i); ov.remove(); }
    }
    if(a==='del' && confirm('確定移除這張照片？')){ try{ localStorage.removeItem('introTrip'+i); }catch(err){} refreshTrip(i); ov.remove(); }
  };
  document.body.appendChild(ov);
}

let _introSig = '';
function renderIntro(force){
  const root = document.getElementById('intro-root');
  if(!root) return;
  const sig = JSON.stringify([introData.summary && introData.summary.display, introData.footprint && introData.footprint.display, introData.state]);
  if(!force && sig===_introSig && root.querySelector('.iv2-sec')) return;
  _introSig = sig;

  const logoSrc = (document.querySelector('.topbar-logo-img')||{}).src || '';
  let photo = '';
  try{ photo = localStorage.getItem('introPhoto') || ''; }catch(e){}
  if(!photo && cellText(INTRO_CELLS.photoUrl)) photo = driveThumb(cellText(INTRO_CELLS.photoUrl));

  const val = a1 => cnt(cellText(a1) || '—');
  const fp  = getFootprint();
  const rep = getRepairBreakdown();
  const okSum = rep.ok.reduce((s,x)=>s+x[1],0), noSum = rep.no.reduce((s,x)=>s+x[1],0), tot = okSum+noSum || 1;
  const okTxt = rep.source==='sheet' ? (cellText(INTRO_CELLS.okCount) || '—') : String(okSum);
  const noTxt = rep.source==='sheet' ? (cellText(INTRO_CELLS.noCount) || '—') : String(noSum);
  let rateTxt = rep.source==='sheet' ? cellText(INTRO_CELLS.repairRate) : '';
  if(!rateTxt) rateTxt = (okSum+noSum) ? Math.round(okSum/(okSum+noSum)*100)+'%' : '—';
  const rateNum = rateTxt.replace(/%$/,''), hasPct = /%$/.test(rateTxt);
  const sampleTag = '<span class="iv2-tag">示意資料</span>';
  const top = fp.places[0];
  const yearsTxt = fp.yMin ? (fp.yMin===fp.yMax ? `${fp.yMin}` : `${fp.yMin}–${fp.yMax}`) : '';

  // 圓餅細項資訊（給互動用）
  const pctTxt = n => (n/tot*100)<1 ? '<1%' : Math.round(n/tot*100)+'%';
  INTRO_SEG_INFO = { 'grp:ok':{label:'成功', n:okSum, pct:pctTxt(okSum)}, 'grp:no':{label:'失敗', n:noSum, pct:pctTxt(noSum)} };
  rep.ok.forEach(([l,n],i)=>INTRO_SEG_INFO['ok-'+i] = {label:shortLabel(l), n, pct:pctTxt(n)});
  rep.no.forEach(([l,n],i)=>INTRO_SEG_INFO['no-'+i] = {label:shortLabel(l), n, pct:pctTxt(n)});

  const legendGroup = (title, items, shades, grp) => items.length ? `
    <div><div class="iv2-lg-h">${title}</div>
      ${items.map(([l,n],i)=>`<div class="iv2-lg-i" data-seg="${grp}-${i}"><i style="background:${shade(shades,i)}"></i><span>${escH(shortLabel(l))}</span><b class="iv2-num">${escH(pctTxt(n))}</b></div>`).join('')}
    </div>` : '';

  const notes = [];
  const st = introData.state;
  if(st.summary==='missing' || st.footprint==='missing') notes.push('尚未讀到 Google 表單資料：請確認 Apps Script 已更新並重新部署（新版本）。');
  if(st.summary==='error')   notes.push('讀取「overall_summary」失敗' + (introData.msg.summary ? '：'+escH(introData.msg.summary) : ''));
  if(st.footprint==='error') notes.push('讀取「SUMMARY_MAP」失敗' + (introData.msg.footprint ? '：'+escH(introData.msg.footprint) : ''));

  root.innerHTML = `
  <section class="iv2-sec iv2-hero">
    ${logoSrc ? `<img src="${logoSrc}" alt="小家電維修所" data-rv>` : ''}
    <div class="iv2-hero-t" data-rv style="--d:120ms">小家電維修所</div>
    <div class="iv2-hero-s" data-rv style="--d:220ms">SINCE 2016</div>
  </section>

  <section class="iv2-sec">
    <div class="iv2-eyebrow" data-rv>01　關於我們</div>
    <div class="iv2-about">
      <div class="iv2-about-t" data-rv style="--d:80ms">創立於 <b class="iv2-num">2016</b> 年，我們是由一群各自有正職工作，利用假日透過維修回饋社會的「家電醫生」。</div>
      <div class="iv2-photo" data-rv style="--d:200ms" onclick="pickIntroPhoto()">${photoInner(photo)}</div>
    </div>
  </section>

  <section class="iv2-sec">
    <div class="iv2-eyebrow" data-rv>02　一路走來</div>
    <div class="iv2-h" data-rv style="--d:80ms">走進社區，一場一場累積</div>
    <div class="iv2-tiles">
      <div class="iv2-tile" data-rv style="--d:120ms;background:var(--i-green-t);color:var(--i-green);">
        ${ICONS.clinic}
        <div class="iv2-tile-n iv2-num">${val(INTRO_CELLS.clinics)}<span class="iv2-tile-u">場</span></div>
        <div class="iv2-tile-l">家電義診</div>
      </div>
      <div class="iv2-tile" data-rv style="--d:240ms;background:var(--i-yellow-t);color:#b9781a;">
        ${ICONS.course}
        <div class="iv2-tile-n iv2-num">${val(INTRO_CELLS.courses)}<span class="iv2-tile-u">場</span></div>
        <div class="iv2-tile-l">工作坊／課程</div>
      </div>
    </div>
  </section>

  <section class="iv2-sec">
    <div class="iv2-eyebrow" data-rv>03　社會效益</div>
    <div class="iv2-h" data-rv style="--d:80ms">每一台修好的家電，都是少一份廢棄物</div>
    <div class="iv2-big" data-rv style="--d:140ms">
      <div><span class="iv2-big-n iv2-num">${val(INTRO_CELLS.repaired)}</span><span class="iv2-big-u">台</span></div>
      <div class="iv2-big-l">總共維修的小家電</div>
    </div>
    <div class="iv2-tiles">
      <div class="iv2-tile" data-rv style="--d:120ms;background:var(--i-soft);color:var(--i-gray);">
        ${ICONS.waste}
        <div class="iv2-tile-n iv2-num">${val(INTRO_CELLS.wasteKg)}<span class="iv2-tile-u">kg</span></div>
        <div class="iv2-tile-l">減少廢棄物</div>
      </div>
      <div class="iv2-tile" data-rv style="--d:240ms;background:var(--i-green-t);color:var(--i-green);">
        ${ICONS.co2}
        <div class="iv2-tile-n iv2-num">${val(INTRO_CELLS.co2Kg)}<span class="iv2-tile-u">kg</span></div>
        <div class="iv2-tile-l">減少碳排放 CO₂e</div>
      </div>
    </div>
  </section>

  <section class="iv2-sec">
    <div class="iv2-eyebrow" data-rv>04　足跡</div>
    <div class="iv2-h" data-rv style="--d:80ms">我們去過的地方${fp.sample ? sampleTag : ''}</div>
    <div class="iv2-p" data-rv style="--d:140ms">每一場維修健檢是一個圓點，顏色越深代表去過越多次。</div>
    <div class="iv2-mapwrap">
      <div class="iv2-map" data-rv style="--d:120ms">
        ${buildMapSvg(fp.places)}
        <div class="iv2-legend"><span>${legendDot(1)}1</span><span>${legendDot(3)}3</span><span>${legendDot(6)}6+ 次</span></div>
      </div>
      <div class="iv2-trips">
        ${[0,1,2].map(i=>`<div class="iv2-trip" data-trip="${i}" data-rv style="--d:${260+i*120}ms" onclick="tripClick(${i})">${tripInner(i)}</div>`).join('')}
      </div>
    </div>
    <div class="iv2-mapstats" data-rv style="--d:100ms">
      <div><b class="iv2-num">${cnt(String(fp.visits))}</b>場維修健檢</div>
      <div><b class="iv2-num">${cnt(String(fp.places.length))}</b>個地點</div>
      ${yearsTxt ? `<div><b class="iv2-num">${yearsTxt}</b>年份</div>` : ''}
    </div>
    <div class="iv2-note">
      ${top ? `最常前往：${escH(top.name)}・${top.count} 次` : '尚無地點資料'}
      ${fp.unmatched.length ? `<br>有 ${fp.unmatched.length} 筆地址無法對應到地圖：${escH(fp.unmatched.slice(0,3).join('、'))}${fp.unmatched.length>3?'…':''}` : ''}
      ${fp.noAddr ? `<br>有 ${fp.noAddr} 場維修健檢沒有填地址` : ''}
    </div>
  </section>

  <section class="iv2-sec">
    <div class="iv2-eyebrow" data-rv>05　維修成果</div>
    <div class="iv2-h" data-rv style="--d:80ms">整體維修率${rep.source==='sample' ? sampleTag : ''}</div>
    <div class="iv2-rate-n iv2-num" data-rv style="--d:140ms">${cnt(rateNum)}${hasPct ? '<small>%</small>' : ''}</div>
    <div class="iv2-rate-s" data-rv style="--d:200ms">成功 <span class="iv2-num">${cnt(okTxt)}</span> 件・失敗 <span class="iv2-num">${cnt(noTxt)}</span> 件</div>
    ${buildRepairDonut(rep.ok, rep.no)}
    <div class="iv2-readout">將滑鼠移到圓餅上（手機請點選），查看各項細節</div>
    <div class="iv2-lg" data-rv>
      ${legendGroup('成功', rep.ok, OK_SHADES, 'ok')}
      ${legendGroup('失敗', rep.no, NO_SHADES, 'no')}
    </div>
    ${notes.length ? `<div class="iv2-note">${notes.join('<br>')}</div>` : ''}
  </section>`;

  bindDonut(root);
  initIntroMotion(root);
}

function pickIntroPhoto(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function(){
    if(!inp.files || !inp.files[0]) return;
    compressImage(inp.files[0], function(dataUrl){
      try{ localStorage.setItem('introPhoto', dataUrl); }
      catch(e){ showToast('⚠️ 照片太大，無法儲存'); return; }
      const el = document.querySelector('#intro-root .iv2-photo');
      if(el) el.innerHTML = photoInner(dataUrl);
    });
  };
  inp.click();
}


loadSettings();
renderInterviewLog();
document.getElementById('sync-pill').style.display = 'flex';
document.getElementById('q').addEventListener('input',function(){searchQ=this.value.trim();render();});
// 開啟即拉取真實資料，每 10 秒自動同步
fetchData().then(()=>startAutoSync());
// 每分鐘重新渲染看板，讓計時數字更新
setInterval(()=>{ if(allCards.length) render(); }, 60000);
</script>
